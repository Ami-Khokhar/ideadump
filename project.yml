name: TapLog
options:
  bundleIdPrefix: dev.amteshwar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Set here rather than in Xcode so it survives `xcodegen generate`.
    DEVELOPMENT_TEAM: FKM4DL483M
    CURRENT_PROJECT_VERSION: 1
    # Every Info.plist reads these two, so one edit versions the app and both
    # extensions together. Raise the build number before each upload.
    MARKETING_VERSION: "1.0"
targets:
  TapLog:
    type: application
    platform: iOS
    sources:
      - path: Sources/TapLog
    dependencies:
      - target: TapLogWidget
        embed: true
      - target: TapLogShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.amteshwar.taplog
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    entitlements:
      path: Configs/TapLog.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.amteshwar.taplog
    info:
      path: Configs/Info.plist
      properties:
        CFBundleDisplayName: TapLog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The app uses no encryption beyond what iOS provides, so App Store
        # Connect need not ask about export compliance on every upload.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: dev.amteshwar.taplog
            CFBundleURLSchemes:
              - taplog

  TapLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/TapLogWidget
      - path: Sources/TapLog/Models
      - path: Sources/TapLog/Shared
      - path: Sources/TapLog/DeepLink
      # Only the extension-safe quick-log intent belongs in the widget target.
      # Foreground intents and AppShortcutsProvider are app-only metadata.
      - path: Sources/TapLog/AppIntents/QuickLogIntent.swift
      # Just enough of the botanical tree art to render one decorative glyph on
      # the widget. TreeMark.swift needs BudgetCalculator.swift for its
      # TreeHealthMark(_:) extension; TreeStateGlyph.swift is the small
      # silhouette variant built for badge-sized rendering; Theme.swift supplies
      # the adaptive palette (and is referenced by TreeStateGlyph's #Preview).
      # None of the three touch SwiftData models or app-only view types beyond
      # what this target already compiles (Entry, SpendCategory).
      - path: Sources/TapLog/Budget/BudgetCalculator.swift
      - path: Sources/TapLog/Budget/TreeMark.swift
      - path: Sources/TapLog/Budget/TreeStateGlyph.swift
      - path: Sources/TapLog/Theme/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.amteshwar.taplog.widget
        SKIP_INSTALL: YES
    entitlements:
      path: Configs/TapLogWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.amteshwar.taplog
    info:
      path: Configs/TapLogWidget-Info.plist
      properties:
        CFBundleDisplayName: TapLog Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  TapLogShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/TapLogShare
      - path: Sources/TapLog/Models
      - path: Sources/TapLog/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.amteshwar.taplog.share
        SKIP_INSTALL: YES
    entitlements:
      path: Configs/TapLogShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.amteshwar.taplog
    info:
      path: Configs/TapLogShare-Info.plist
      properties:
        CFBundleDisplayName: Add to TapLog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true

  TapLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TapLogTests
    dependencies:
      - target: TapLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.amteshwar.taplog.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TapLog.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TapLog"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  TapLog:
    build:
      targets:
        TapLog: all
    run:
      config: Debug
      # Local StoreKit testing: the simulator serves the product from this file,
      # so the paywall can be driven end to end without App Store Connect.
      storeKitConfiguration: Configs/TapLog.storekit
    test:
      config: Debug
      targets:
        - TapLogTests
    archive:
      config: Release
